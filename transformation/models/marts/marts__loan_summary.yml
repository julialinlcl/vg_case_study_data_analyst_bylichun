version: 2

models:
  - name: loan_summary
    description: "Summary of loans per customer"
    columns:
      - name: customer_id
        description: "Customer identifier"
      - name: total_loans
        description: "Total number of loans"
      - name: total_loan_amount
        description: "Total loan amount"
      - name: average_interest_rate
        description: "Average interest rate"
      - name: active_loans_count
        description: "Number of active loans"
      - name: closed_loans_count
        description: "Number of closed loans"
      - name: latest_loan_status
        description: "Most recent loan status"
      - name: average_loan_term
        description: "Average loan term in months"
