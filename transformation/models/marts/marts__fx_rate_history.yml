version: 2

models:
  - name: fx_rate_history
    description: "Historical FX rates with daily change and moving average"
    columns:
      - name: currency_iso_code
        description: "Currency ISO code"
      - name: fx_rate_date
        description: "Date of FX rate"
      - name: fx_rate
        description: "FX rate value"
      - name: fx_rate_change
        description: "Change from previous day"
      - name: moving_average_fx_rate
        description: "7-day moving average of FX rate"
