version: 2

models:
  - name: transaction_summary
    description: "Summary of transactions per account and customer"
    columns:
      - name: customer_id
        description: "Customer identifier"
      - name: account_id
        description: "Account identifier"
      - name: total_transaction_amount
        description: "Total amount of transactions"
      - name: transaction_count
        description: "Number of transactions"
      - name: first_transaction_date
        description: "Date of first transaction"
      - name: last_transaction_date
        description: "Date of last transaction"
      - name: most_common_transaction_type
        description: "Most frequent transaction type"
    tags:
      - marts
      - finance
      - transaction_summary
